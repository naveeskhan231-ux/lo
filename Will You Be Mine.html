<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Will You Be Mine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Figtree:wght@400;600;700&display=swap">
<style>
  /* Layout: one centered column on a night-plum ground. Screen 1 asks, screen 2 answers. All boldness lives in the serif italic headline. */
  :root {
    --bg: #14080f;
    --bg-glow: #3a1228;
    --ink: #fff1f4;
    --muted: #c9a1b0;
    --rose: #ff5c8a;
    --rose-deep: #d92f63;
    --line: #5a2a42;
    --display: "Instrument Serif", "Iowan Old Style", Georgia, serif;
    --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--body);
    font-size: 16px;
    line-height: 1.5;
    padding-inline: 16px;
    overflow-x: hidden;
    background-image:
      radial-gradient(60rem 40rem at 50% -10%, var(--bg-glow), transparent 70%),
      radial-gradient(40rem 30rem at 90% 110%, #2a0c1d, transparent 70%);
    background-repeat: no-repeat;
  }
  .screen {
    min-height: 100%;
    display: grid;
    place-content: center;
    justify-items: center;
    text-align: center;
    gap: 1.25rem;
    padding-block: 3rem;
    max-width: 38rem;
    margin-inline: auto;
  }
  .eyebrow {
    font-size: 0.8rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0;
  }
  h1 {
    font-family: var(--display);
    font-weight: 400;
    font-style: italic;
    font-size: clamp(2.8rem, 11vw, 5.6rem);
    line-height: 1;
    margin: 0;
    text-wrap: balance;
  }
  h1 em { font-style: normal; color: var(--rose); }
  .sub {
    margin: 0;
    max-width: 30rem;
    color: var(--muted);
    font-size: 1.05rem;
    text-wrap: balance;
  }
  .heart {
    width: 4.5rem;
    height: 4.5rem;
    fill: var(--rose);
    animation: beat 1.6s ease-in-out infinite;
    filter: drop-shadow(0 0 1.2rem rgba(255, 92, 138, 0.55));
  }
  .actions {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1.25rem;
    padding-block: 2.2rem 1.6rem;
    min-height: 6rem;
  }
  button {
    font-family: var(--body);
    font-size: 1.05rem;
    font-weight: 700;
    border: 0;
    border-radius: 999px;
    padding: 0.85rem 2rem;
    cursor: pointer;
    touch-action: manipulation;
  }
  button:focus-visible { outline: 3px solid var(--blush, #ffd1dc); outline-offset: 3px; }
  #yes {
    background: var(--rose);
    color: #2a0715;
    transform: scale(var(--s, 1));
    transition: transform 0.35s cubic-bezier(.3, 1.6, .5, 1), background 0.2s;
    box-shadow: 0 0.6rem 2rem rgba(255, 92, 138, 0.35);
    z-index: 2;
  }
  #yes:hover { background: #ff7399; }
  #no {
    background: transparent;
    color: var(--ink);
    box-shadow: inset 0 0 0 1.5px var(--line);
    transition: left 0.28s cubic-bezier(.2, .9, .3, 1.1), top 0.28s cubic-bezier(.2, .9, .3, 1.1);
  }
  #no.fleeing { position: fixed; z-index: 5; }
  .hint {
    min-height: 1.6rem;
    margin: 0;
    color: var(--rose);
    font-weight: 600;
  }
  .hearts-canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 1;
  }
  #win { position: relative; z-index: 2; }
  #win h1 { animation: rise 0.9s 0.1s both cubic-bezier(.2, .8, .2, 1); }
  #win h1 + h1 { animation-delay: 0.55s; }
  #win .sub { animation: rise 0.9s 1s both cubic-bezier(.2, .8, .2, 1); }
  .rule {
    width: 3.5rem;
    height: 1px;
    background: var(--line);
    border: 0;
    margin: 0.4rem 0;
  }
  @keyframes beat {
    0%, 100% { transform: scale(1); }
    15% { transform: scale(1.14); }
    30% { transform: scale(1); }
    45% { transform: scale(1.08); }
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(1.2rem); }
    to { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .heart { animation: none; }
    #win h1, #win .sub { animation: none; }
    #no, #yes { transition: none; }
  }
</style>

<main>
  <section class="screen" id="ask">
    <p class="eyebrow" id="for">For you</p>
    <svg class="heart" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
    <h1>Will you be mine, <em>forever?</em></h1>
    <p class="sub">I have one question, and I have been saving it for you.</p>
    <div class="actions">
      <button id="yes" type="button">Yes</button>
      <span id="slot" aria-hidden="true"></span>
      <button id="no" type="button">No</button>
    </div>
    <p class="hint" id="hint" aria-live="polite"></p>
  </section>

  <section class="screen" id="win" hidden>
    <p class="eyebrow" id="forWin">You said yes</p>
    <svg class="heart" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
    <h1>You are my life partner.</h1>
    <h1><em>My love of life.</em></h1>
    <hr class="rule">
    <p class="sub">Thank you for choosing me. I choose you today, and every day after.</p>
  </section>
</main>
<canvas class="hearts-canvas" id="fx" aria-hidden="true"></canvas>

<script>
(function () {
  var ask = document.getElementById('ask');
  var win = document.getElementById('win');
  var yes = document.getElementById('yes');
  var no = document.getElementById('no');
  var slot = document.getElementById('slot');
  var hint = document.getElementById('hint');
  var canvas = document.getElementById('fx');
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Optional name from the link: open the page with #Sara to greet her by name.
  try {
    var raw = decodeURIComponent((location.hash || '').slice(1)).replace(/[-_.~]+/g, ' ').trim();
    if (raw) {
      raw = raw.slice(0, 24);
      document.getElementById('for').textContent = 'For ' + raw;
      document.getElementById('forWin').textContent = 'You said yes, ' + raw;
    }
  } catch (e) {}

  var lines = [
    'Are you sure?',
    'Try again, my love.',
    'That button is shy.',
    'It keeps running away from you.',
    'Maybe you meant the other one.',
    'Look how big Yes is getting.',
    'There is only one answer here.',
    'Okay, please just press Yes.'
  ];
  var count = 0, fled = false, lastDodge = 0;
  var px = innerWidth / 2, py = innerHeight / 2;

  function overlaps(x, y, w, h, r, pad) {
    return x < r.right + pad && x + w > r.left - pad && y < r.bottom + pad && y + h > r.top - pad;
  }

  function dodge() {
    var now = Date.now();
    if (now - lastDodge < 180) return;
    lastDodge = now;
    var r = no.getBoundingClientRect();
    var w = r.width, h = r.height;
    if (!fled) {
      slot.style.display = 'inline-block';
      slot.style.width = w + 'px';
      slot.style.height = h + 'px';
      no.style.left = r.left + 'px';
      no.style.top = r.top + 'px';
      no.classList.add('fleeing');
      void no.offsetWidth;
      fled = true;
    }
    var m = 16, vw = innerWidth, vh = innerHeight;
    var yr = yes.getBoundingClientRect();
    var x = m, y = m, tries = 0, ok = false;
    while (!ok && tries < 60) {
      x = m + Math.random() * Math.max(1, vw - w - 2 * m);
      y = m + Math.random() * Math.max(1, vh - h - 2 * m);
      var far = Math.hypot(x + w / 2 - px, y + h / 2 - py) > Math.min(220, vw * 0.4);
      ok = far && !overlaps(x, y, w, h, yr, 14);
      tries++;
    }
    no.style.left = x + 'px';
    no.style.top = y + 'px';
    hint.textContent = lines[Math.min(count, lines.length - 1)];
    count++;
    yes.style.setProperty('--s', Math.min(1 + count * 0.1, 1.7).toFixed(2));
  }

  document.addEventListener('pointermove', function (e) {
    px = e.clientX; py = e.clientY;
    if (!win.hidden) return;
    var r = no.getBoundingClientRect();
    var d = Math.hypot(px - (r.left + r.width / 2), py - (r.top + r.height / 2));
    if (d < Math.max(r.width, r.height) * 0.5 + 70) dodge();
  });
  ['pointerdown', 'touchstart', 'mousedown', 'click', 'focus'].forEach(function (ev) {
    no.addEventListener(ev, function (e) {
      if (e.cancelable) e.preventDefault();
      if (e.touches && e.touches[0]) { px = e.touches[0].clientX; py = e.touches[0].clientY; }
      else if (typeof e.clientX === 'number' && ev !== 'focus') { px = e.clientX; py = e.clientY; }
      lastDodge = 0;
      dodge();
    }, { passive: false });
  });
  window.addEventListener('resize', function () {
    if (!fled) return;
    var r = no.getBoundingClientRect();
    no.style.left = Math.min(r.left, Math.max(16, innerWidth - r.width - 16)) + 'px';
    no.style.top = Math.min(r.top, Math.max(16, innerHeight - r.height - 16)) + 'px';
  });

  /* Falling hearts */
  var ctx = canvas.getContext('2d');
  var parts = [], running = false, dpr = 1;
  function size() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = innerWidth * dpr;
    canvas.height = innerHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  size();
  window.addEventListener('resize', size);
  var colors = ['#ff5c8a', '#ff8fb0', '#ffd1dc', '#d92f63', '#ff7399'];
  function spawn(burst) {
    parts.push({
      x: burst ? innerWidth / 2 + (Math.random() - 0.5) * 80 : Math.random() * innerWidth,
      y: burst ? innerHeight * 0.55 : -20,
      vx: burst ? (Math.random() - 0.5) * 9 : (Math.random() - 0.5) * 0.8,
      vy: burst ? -Math.random() * 9 - 3 : Math.random() * 1.2 + 0.8,
      s: Math.random() * 12 + 8,
      r: Math.random() * 6.28,
      vr: (Math.random() - 0.5) * 0.06,
      c: colors[(Math.random() * colors.length) | 0],
      a: Math.random() * 0.4 + 0.6
    });
  }
  function drawHeart(p) {
    var s = p.s;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.r);
    ctx.globalAlpha = p.a;
    ctx.fillStyle = p.c;
    ctx.beginPath();
    ctx.moveTo(0, s * 0.4);
    ctx.bezierCurveTo(-s * 0.9, -s * 0.1, -s * 0.5, -s * 0.9, 0, -s * 0.35);
    ctx.bezierCurveTo(s * 0.5, -s * 0.9, s * 0.9, -s * 0.1, 0, s * 0.4);
    ctx.fill();
    ctx.restore();
  }
  var frame = 0;
  function tick() {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    if (frame++ % 6 === 0 && parts.length < 90) spawn(false);
    for (var i = parts.length - 1; i >= 0; i--) {
      var p = parts[i];
      p.vy += 0.07 * (p.vy < 2.2 ? 1 : 0);
      p.x += p.vx; p.y += p.vy; p.r += p.vr;
      p.vx *= 0.995;
      drawHeart(p);
      if (p.y > innerHeight + 30) parts.splice(i, 1);
    }
    requestAnimationFrame(tick);
  }

  yes.addEventListener('click', function () {
    ask.hidden = true;
    no.hidden = true;
    win.hidden = false;
    window.scrollTo(0, 0);
    if (!reduce && !running) {
      running = true;
      for (var i = 0; i < 60; i++) spawn(true);
      tick();
    }
  });
})();
</script>

</body></html>
